---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-metrics
  namespace: assignment-demo
  labels:
    release: kps
spec:
  namespaceSelector:
    matchName:
      - assignment-demo
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
...