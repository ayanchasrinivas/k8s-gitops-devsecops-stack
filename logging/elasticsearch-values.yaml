---
replicas: 1
minimumMasterNodes: 1
esJavaOpts: "-Xms512m -Xmx512m"
resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1.5Gi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    discovery.type: single-node
...