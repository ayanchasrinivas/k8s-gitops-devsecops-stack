input:
  tail:
    enabled: true

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name              es
        Match             kube.*
        Host              elasticsearch-master
        Port              9200
        Logstash_Format   On
        Logstash_Prefix   backend-logs
        Replace_Dots      On
        Suppress_Type_Name On
        Retry_Limit       False
        # TLS/auth are off here to match Elasticsearch's security-disabled
        # demo config (logging/elasticsearch-values.yaml). In production
        # this output block would carry tls On + an HTTP_User/HTTP_Passwd
        # or API key, matching a secured Elasticsearch cluster.

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"