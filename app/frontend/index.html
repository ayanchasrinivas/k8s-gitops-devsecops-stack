<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K8S, GitOps, DevSecOps Assignment Stack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="dot"></span>
        <h1>Infra Task Tracker</h1>
      </div>
      <div class="status" id="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">checking backend…</span>
      </div>
    </header>

    <section class="card">
      <form id="item-form">
        <input id="item-name" type="text" placeholder="Task name" required />
        <input id="item-desc" type="text" placeholder="Description (optional)" />
        <button type="submit">Add task</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Tasks</h2>
        <button id="refresh-btn" class="ghost">Refresh</button>
      </div>
      <ul id="item-list"></ul>
      <p id="empty-state" class="empty">No tasks yet — add one above.</p>
    </section>

    <footer>
      served by <code id="pod-name">…</code>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
