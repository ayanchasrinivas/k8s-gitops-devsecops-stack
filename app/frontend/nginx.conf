server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied here as a fallback; in-cluster we route /api via Ingress directly
    # to the backend Service, so this only matters if you hit the frontend
    # Service directly without going through Ingress.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
